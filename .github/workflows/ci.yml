# Runs on every pull request and every push to main: lint, the full test
# suite (unit + database tests against the real migrations in PGlite), and
# a production build. Nothing broken should be mergeable — pair this with
# branch protection on main requiring the "checks" job to pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests (unit + database)
        run: npm test

      - name: Production build
        run: npm run build
